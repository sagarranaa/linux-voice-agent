[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-voice-agent"
version = "0.1.0"
description = "Linux voice assistant using Groq and local tools"
requires-python = ">=3.10"
dependencies = [
    "groq",
    "sounddevice",
    "soundfile",
    "numpy",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
